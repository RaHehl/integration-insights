[project]
name = "integration-insights"
version = "0.2.0"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["A001", "ASYNC", "B", "BLE", "C", "COM818", "D", "DTZ003", "DTZ004", "DTZ011", "E", "F", "F541", "FLY", "FURB", "G", "I", "INP", "ISC", "ICN001", "ICN002", "LOG", "N804", "N805", "N806", "N815", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "S107", "S102", "S103", "S108", "S301", "S306", "S307", "S313", "S314", "S315", "S316", "S317", "S318", "S319", "S601", "S602", "S604", "S608", "S609", "SIM", "SLF", "SLOT", "T100", "T20", "TC", "TID", "TRY", "UP", "UP031", "UP032", "W"]
ignore = ["ASYNC109", "ASYNC110", "ASYNC240", "B008", "B019", "D202", "D203", "D213", "D406", "D407", "D417", "E501", "PLC1901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLW0108", "PLW1641", "PLW2901", "PT011", "PT018", "RUF001", "RUF012", "RUF015", "RUF043", "SIM102", "SIM103", "SIM108", "SIM115", "TC001", "TC002", "TC003", "TC006", "TRY003", "TRY400", "UP047", "UP049", "W191", "E111", "E114", "E117", "D206", "D300", "Q", "COM812", "COM819", "PLE0605", "FURB116", "ISC004", "LOG004"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"
"voluptuous".msg = "use probatio instead"
"__future__.annotations".msg = "It should not be needed because Home Assistant requires Python 3.14+"

[tool.ruff.lint.pydocstyle]
convention = "google"
property-decorators = ["propcache.api.cached_property"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.mypy]
python_version = "3.14"
platform = "linux"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Home Assistant re-exports names from its component packages.
module = "homeassistant.*"
implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
